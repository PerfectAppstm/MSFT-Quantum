<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=job-opper-website/index.html">
    <title>Redirecting to Job Opper™...</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #ffe0ec 0%, #ffffff 100%);
        }
        .loader {
            text-align: center;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #ffe0ec;
            border-top: 5px solid #ff6b9d;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            color: #ff6b9d;
            font-size: 24px;
        }
        p {
            color: #6b7280;
        }
        a {
            color: #ff6b9d;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <h1>Redirecting to Job Opper™...</h1>
        <p>If you are not redirected, <a href="job-opper-website/index.html">click here</a>.</p>
    </div>
</body>
</html>
